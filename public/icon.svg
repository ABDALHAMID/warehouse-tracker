<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Subtle Accent Ring -->
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#334155" stroke-width="4" stroke-opacity="0.4" />

  <!-- Isometric Warehouse Box / Structural Beam Cube with Glow -->
  <g filter="url(#glow)">
    <!-- Top Isometric Face -->
    <path d="M 256 128 L 396 208 L 256 288 L 116 208 Z" fill="url(#topFace)" />

    <!-- Left Isometric Face -->
    <path d="M 116 208 L 256 288 L 256 404 L 116 324 Z" fill="url(#leftFace)" />

    <!-- Right Isometric Face -->
    <path d="M 256 288 L 396 208 L 396 324 L 256 404 Z" fill="url(#rightFace)" />

    <!-- Tape / Ribbon Details across Top -->
    <path d="M 228 144 L 256 160 L 256 288 L 228 272 Z" fill="#ffffff" fill-opacity="0.22" />
    <path d="M 256 160 L 284 144 L 284 272 L 256 288 Z" fill="#ffffff" fill-opacity="0.12" />

    <!-- Isometric Structural Beam / Reinforcement Lines -->
    <path d="M 160 258 L 256 313 L 352 258" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3" />
    <path d="M 160 298 L 256 353 L 352 298" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.3" />

    <!-- Corner Highlight Bevels -->
    <path d="M 256 128 L 396 208 L 396 214 L 256 134 Z" fill="#ffffff" fill-opacity="0.4" />
    <path d="M 256 128 L 116 208 L 116 214 L 256 134 Z" fill="#ffffff" fill-opacity="0.25" />
    <line x1="256" y1="288" x2="256" y2="404" stroke="#ffffff" stroke-width="3" stroke-opacity="0.2" />
  </g>
</svg>

